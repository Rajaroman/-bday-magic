<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d20"><title>Anuratha ✦</title>
<style>
:root{--cyan:#7cf7f0;--violet:#b5a1ff;--gold:#ffe2a1}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;overflow:hidden;background:#080d20;color:#f7f8ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}.glow{position:fixed;inset:-35%;z-index:0;pointer-events:none;background:conic-gradient(from 0deg,transparent,#28e5dc24,transparent,#9270ff2c,transparent,#f5c76c20,transparent);filter:blur(65px);animation:spin 22s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}.wrap{position:relative;z-index:1;min-height:100svh;display:grid;place-items:center;text-align:center;padding:28px 18px}
.blob{position:absolute;width:210px;height:210px;border-radius:50%;filter:blur(45px);opacity:.25;animation:float 7s ease-in-out infinite}.b1{background:#00e5df;top:12%;left:-80px}.b2{background:#805cff;bottom:10%;right:-80px;animation-delay:-3s}
@keyframes float{50%{transform:translate(35px,-28px) scale(1.18)}}
.content{max-width:700px}.tag{display:inline-block;border:1px solid #ffffff30;background:#ffffff0a;border-radius:99px;padding:9px 14px;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:#c5fbff;animation:pop .8s both}
h1{font-size:clamp(3.7rem,14vw,8rem);line-height:.9;letter-spacing:-.09em;margin:26px 0 14px;animation:rise 1s .12s both}
.name{background:linear-gradient(90deg,#fff,var(--cyan),var(--violet),var(--gold),#fff);background-size:300%;color:transparent;background-clip:text;-webkit-background-clip:text;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:300% center}}.sub{font-size:clamp(1rem,3vw,1.2rem);color:#b9c6e5;animation:rise 1s .3s both}.line{height:1px;width:90px;margin:24px auto;background:linear-gradient(90deg,transparent,var(--cyan),var(--violet),transparent);animation:widen 2s ease-in-out infinite alternate}
@keyframes widen{to{width:180px;filter:drop-shadow(0 0 8px var(--cyan))}}
button{position:relative;overflow:hidden;border:0;border-radius:99px;padding:15px 23px;margin-top:14px;font-weight:800;font-size:1rem;color:#10152c;background:linear-gradient(100deg,var(--cyan),var(--violet));cursor:pointer;box-shadow:0 0 28px #7cf7f033;transition:transform .25s,box-shadow .25s}
button:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 0 42px #7cf7f077}button:active{transform:scale(.97)}
button:before{content:"";position:absolute;top:-60%;left:-40%;width:25%;height:220%;transform:rotate(25deg);background:#ffffffa8;filter:blur(8px);animation:sweep 3s ease-in-out infinite}
@keyframes sweep{0%,35%{left:-40%}70%,100%{left:130%}}
.note{color:#e3edff;line-height:1.8;max-width:470px;margin:0 auto;max-height:0;opacity:0;overflow:hidden;transform:translateY(15px);transition:max-height .6s,opacity .5s,transform .5s}.note.open{max-height:100px;opacity:1;transform:translateY(0);margin-top:17px}
footer{position:absolute;bottom:17px;left:0;right:0;color:#6f7e9e;font-size:.72rem;letter-spacing:.08em}
.spark{position:fixed;z-index:5;pointer-events:none;font-size:20px;animation:burst 1.3s ease-out forwards}@keyframes burst{0%{opacity:0;transform:translate(0,0) scale(.2)}15%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.5) rotate(140deg)}}
.teddy-overlay{position:fixed;z-index:10;inset:0;display:grid;place-items:center;background:#070b1beF;backdrop-filter:blur(12px);opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s;padding:20px}
.teddy-overlay.show{opacity:1;visibility:visible}.teddy-card{width:min(92vw,390px);text-align:center;position:relative;padding:25px 22px 28px;border-radius:30px;border:1px solid #ffffff28;background:linear-gradient(145deg,#192448,#10172e);box-shadow:0 0 70px #8b7bff30;transform:scale(.75) translateY(25px);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.teddy-overlay.show .teddy-card{transform:scale(1) translateY(0)}
.close{position:absolute;right:13px;top:12px;margin:0;padding:7px 12px;background:#ffffff14;color:white;font-size:1.1rem}
.teddy-stage{height:235px;display:grid;place-items:center;position:relative;overflow:hidden}.halo{position:absolute;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,#b6a1ff44,transparent 70%);animation:halo 2s ease-in-out infinite alternate}
@keyframes halo{to{transform:scale(1.2);opacity:.6}}
.teddy{position:relative;width:155px;height:180px;animation:dance .55s ease-in-out infinite alternate;transform-origin:50% 90%;filter:drop-shadow(0 15px 14px #0005)}
@keyframes dance{from{transform:rotate(-9deg) translateY(0)}to{transform:rotate(9deg) translateY(-10px)}}
.ear{position:absolute;top:10px;width:48px;height:48px;border-radius:50%;background:#b87954;border:4px solid #eab58b}.ear:after{content:"";position:absolute;inset:10px;border-radius:50%;background:#f5c6a2}.ear.left{left:8px}.ear.right{right:8px}
.head{position:absolute;top:23px;left:18px;width:119px;height:105px;border-radius:48% 48% 44% 44%;background:linear-gradient(145deg,#e6b68c,#b87954);border:3px solid #f4cba8;z-index:2}
.eye{position:absolute;top:39px;width:9px;height:13px;border-radius:50%;background:#39251f;animation:blink 4s infinite}.eye.left{left:31px}.eye.right{right:31px}@keyframes blink{0%,45%,49%,100%{transform:scaleY(1)}47%{transform:scaleY(.1)}}
.muzzle{position:absolute;left:34px;top:57px;width:50px;height:31px;background:#f5d4b7;border-radius:50%}.nose{position:absolute;left:54px;top:60px;width:12px;height:8px;border-radius:50%;background:#58362e;z-index:3}.smile{position:absolute;left:54px;top:69px;width:13px;height:8px;border-bottom:2px solid #754333;border-radius:50%;z-index:3}
.body{position:absolute;z-index:1;left:37px;top:113px;width:82px;height:62px;border-radius:43% 43% 35% 35%;background:linear-gradient(120deg,#e6b68c,#bd8059);border:3px solid #f4cba8}.belly{position:absolute;inset:12px 16px 6px;border-radius:50%;background:#f5d4b7}
.arm{position:absolute;z-index:3;top:119px;width:28px;height:54px;border-radius:99px;background:#d99e72;border:3px solid #f4cba8;transform-origin:50% 10%}.arm.left{left:20px;transform:rotate(30deg);animation:waveL .4s ease-in-out infinite alternate}.arm.right{right:20px;transform:rotate(-30deg);animation:waveR .4s ease-in-out infinite alternate}
@keyframes waveL{to{transform:rotate(65deg)}}@keyframes waveR{to{transform:rotate(-65deg)}}
.leg{position:absolute;z-index:0;top:158px;width:32px;height:26px;border-radius:50%;background:#c58a61;border:3px solid #f4cba8}.leg.left{left:37px;animation:feetL .3s infinite alternate}.leg.right{right:37px;animation:feetR .3s infinite alternate}@keyframes feetL{to{transform:rotate(-22deg) translateY(4px)}}@keyframes feetR{to{transform:rotate(22deg) translateY(4px)}}
.teddy-title{font-size:1.55rem;margin:0 0 8px;background:linear-gradient(90deg,#fff,var(--cyan),var(--violet));background-clip:text;color:transparent}.teddy-text{color:#c2cce5;line-height:1.65;margin:0}.tiny-hearts{position:absolute;inset:0;pointer-events:none}.heart{position:absolute;color:#ffb6e4;animation:heartfloat 2.4s ease-in-out infinite}.heart:nth-child(1){top:15%;left:13%}.heart:nth-child(2){top:22%;right:12%;animation-delay:-.8s}.heart:nth-child(3){bottom:22%;left:12%;animation-delay:-1.4s}@keyframes heartfloat{50%{transform:translateY(-15px) rotate(15deg) scale(1.25);opacity:.6}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}}
</style></head><body>
<canvas id="fx"></canvas><div class="glow"></div><section class="wrap"><div class="blob b1"></div><div class="blob b2"></div><div class="content">
<div class="tag">✦ A little ILP hello ✦</div><h1><span class="name">Anuratha</span></h1><div class="sub">Good vibes. Great journey. ✨</div><div class="line"></div>
<button id="btn">Tap for a surprise ✦</button><div class="note" id="note">Glad we met at ILP! 😊 Keep smiling and shining. 🌻</div>
</div><footer>MADE WITH GOOD VIBES · ILP</footer></section>
<div class="teddy-overlay" id="teddyOverlay" role="dialog" aria-modal="true" aria-label="Dancing teddy surprise">
<div class="teddy-card"><button class="close" id="close" aria-label="Close surprise">×</button><div class="tiny-hearts"><span class="heart">♡</span><span class="heart">✦</span><span class="heart">♡</span></div>
<div class="teddy-stage"><div class="halo"></div><div class="teddy" aria-label="Cute dancing teddy bear">
<div class="ear left"></div><div class="ear right"></div><div class="head"><span class="eye left"></span><span class="eye right"></span><span class="muzzle"></span><span class="nose"></span><span class="smile"></span></div><div class="body"><div class="belly"></div></div><div class="arm left"></div><div class="arm right"></div><div class="leg left"></div><div class="leg right"></div>
</div></div><h2 class="teddy-title">A tiny teddy dance! 🧸</h2><p class="teddy-text">Just for you, Anuratha ✨<br>Keep smiling, friend!</p></div></div>
<script>
const canvas=document.getElementById('fx'),ctx=canvas.getContext('2d');let w,h,dpr,stars=[];
function size(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.min(115,Math.floor(w/5))},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.7+.2,a:Math.random()*.65+.12,s:Math.random()*.35+.06,p:Math.random()*6}))}
function draw(t){ctx.clearRect(0,0,w,h);for(const s of stars){ctx.globalAlpha=s.a*(.6+.4*Math.sin(t*.001+s.p));ctx.fillStyle='#bafcff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();s.y-=s.s*.18;if(s.y<0){s.y=h;s.x=Math.random()*w}}ctx.globalAlpha=1;requestAnimationFrame(draw)}size();addEventListener('resize',size);requestAnimationFrame(draw);
const btn=document.getElementById('btn'),note=document.getElementById('note'),overlay=document.getElementById('teddyOverlay');
function burst(){for(let i=0;i<36;i++){const s=document.createElement('span');s.className='spark';s.textContent=['✦','✧','♡','✺','·'][Math.floor(Math.random()*5)];s.style.left=(innerWidth/2+(Math.random()-.5)*100)+'px';s.style.top=(innerHeight/2+(Math.random()-.5)*50)+'px';s.style.setProperty('--x',((Math.random()-.5)*innerWidth*.8)+'px');s.style.setProperty('--y',((Math.random()-.5)*innerHeight*.7)+'px');s.style.color=['#7cf7f0','#b5a1ff','#ffe2a1','#ffffff'][i%4];document.body.appendChild(s);setTimeout(()=>s.remove(),1400)}}
btn.addEventListener('click',()=>{note.classList.add('open');overlay.classList.add('show');burst()});
function close(){overlay.classList.remove('show')}document.getElementById('close').addEventListener('click',close);overlay.addEventListener('click',e=>{if(e.target===overlay)close()});addEventListener('keydown',e=>{if(e.key==='Escape')close()});
</script></body></html>
